[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-query-engine"
version = "0.2.0"
description = "Natural-language analytics assistant for FMCG sales data -- NL question in, governed SQL and a structured business answer out."
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.30.0",
    "pyarrow>=15.0.0",
    "sqlglot>=25.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
# The HTTP layer is optional: `sqe ask` and the eval harness never import it, and
# a CI job or a notebook has no reason to pull in a web server. The container
# image installs it.
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pandas-stubs",
    # Property-based tests over the validator and the row-security injector.
    # A fuzzed safety invariant -- "no generated statement ever mutates, and no
    # accepted query ever escapes its row policy" -- covers the shapes nobody
    # thought to write a case for, which is the entire class the example-based
    # tests are weakest on.
    "hypothesis>=6.100",
    # dev implies api: the API tests are part of the offline unit tier, and
    # httpx is what fastapi.testclient drives the app through in-process.
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
]
[project.scripts]
sqe = "semantic_query_engine.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits a real LLM provider over the network; requires an API key and is excluded by default (deselect with -m 'not integration' or select with -m integration)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are prose (prompt copy, chart config, the planner's vocabulary)
# -- wrapping would hurt readability and diffability more than it would help.
"src/semantic_query_engine/prompts/synthesis.py" = ["E501"]
"src/semantic_query_engine/cli/render.py" = ["E501"]
"src/semantic_query_engine/agents/planner.py" = ["E501"]
"src/semantic_query_engine/prompts/few_shot_examples.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
# ``evals`` is type-checked alongside the package, not treated as scratch
# scripts: it is where the project's reported numbers are computed, so a type
# error there is a wrong number rather than a broken script.
packages = ["semantic_query_engine", "evals"]
mypy_path = "src:."
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
